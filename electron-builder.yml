appId: ai.karmaloop.jivam
productName: Jivam
copyright: Copyright © 2026 Karmaloop AI

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  minimumSystemVersion: "13.0"
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  darkModeSupport: true
  # Code signing — uncomment and set env vars when Apple Developer certificate is ready:
  # notarize:
  #   teamId: ${APPLE_TEAM_ID}

dmg:
  title: "Jivam ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch: x64
  # Azure Trusted Signing — uncomment and set env vars when certificate is ready:
  # azureSignOptions:
  #   endpoint: ${AZURE_SIGNING_ENDPOINT}
  #   certificateProfileName: ${AZURE_CERT_PROFILE_NAME}
  #   codeSigningAccountName: ${AZURE_SIGNING_ACCOUNT_NAME}

nsis:
  artifactName: ${productName}-Setup-${version}.exe
  oneClick: false
  perMachine: false                    # install to %LocalAppData% — no UAC elevation needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.exe

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

linux:
  icon: assets/icon.png
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch: x64

publish:
  provider: github
  owner: KarmaloopAI
  repo: JivamAI
